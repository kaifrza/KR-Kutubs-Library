name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unzip app into www
        run: |
          echo "All zips in repo:"
          git ls-files | grep -i '\.zip$' || true
          ZIP=$(git ls-files | grep -i '\.zip$' | while read -r f; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -rn | head -n 1 | cut -d' ' -f2-)
          echo "Using newest zip: $ZIP"
          test -n "$ZIP"
          mkdir -p www
          unzip -oq "$ZIP" -d www
          if [ ! -f www/index.html ]; then
            SUB=$(find www -maxdepth 2 -name index.html | head -n 1 | xargs dirname)
            cp -a "$SUB"/. www/
          fi
          test -f www/index.html
          rm -rf www/supabase
          echo "Build tag in this zip:"
          grep -n "BUILD_TAG =" www/js/features/download-manager.js
          echo "Native folder check:"
          test -f www/native/android/KRDownloaderPlugin.java
          test -f www/native/android/MainActivity.java
          test -f www/native/android/open-with-filter.xml

      - name: Capacitor setup
        run: |
          echo '{"name":"kr-urdu-library","version":"1.0.0","private":true}' > package.json
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<'EOF2'
          {
            "appId": "com.kr.urdulibrary",
            "appName": "KR Urdu Library",
            "webDir": "www"
          }
          EOF2
          npx cap add android

      - name: Bundle offline libraries (PDF.js, Supabase, icons)
        continue-on-error: true
        run: |
          npm i --omit=optional pdfjs-dist@4.10.38 @supabase/supabase-js@2 @fortawesome/fontawesome-free@6.7.2 esbuild
          mkdir -p www/vendor/pdfjs www/vendor/fa/css
          cp node_modules/pdfjs-dist/build/pdf.mjs www/vendor/pdfjs/
          cp node_modules/pdfjs-dist/build/pdf.worker.mjs www/vendor/pdfjs/
          cp node_modules/@fortawesome/fontawesome-free/css/all.min.css www/vendor/fa/css/
          cp -r node_modules/@fortawesome/fontawesome-free/webfonts www/vendor/fa/webfonts
          echo "export { createClient } from '@supabase/supabase-js';" > vendor-entry.js
          npx esbuild vendor-entry.js --bundle --format=esm --minify --platform=browser --outfile=www/vendor/supabase.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/font-awesome/[0-9.]*/css/all.min.css#./vendor/fa/css/all.min.css#' www/index.html
          echo "Vendor files:"
          ls -la www/vendor www/vendor/pdfjs www/vendor/fa/css
          grep -n "vendor/fa" www/index.html

      - name: Native Android plugin (Downloads, reader, Open with)
        run: |
          DEST=android/app/src/main/java/com/kr/urdulibrary
          cp www/native/android/*.java "$DEST"/
          ls -la "$DEST"
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          f = open("www/native/android/open-with-filter.xml").read()
          if "application/pdf" not in s:
              s = s.replace("</activity>", f + "        </activity>", 1)
          open(p, "w").write(s)
          PY
          rm -rf www/native
          MF=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />#' "$MF"
          cat "$MF"

      - name: App icon
        continue-on-error: true
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          IM=$(command -v magick || command -v convert)
          ICON=www/assets/icons/icon-512.png
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}
            s=${d##*:}
            $IM $ICON -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            cp $RES/mipmap-$n/ic_launcher.png $RES/mipmap-$n/ic_launcher_round.png
          done

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: KR-Urdu-Library-APK-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
