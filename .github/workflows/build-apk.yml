
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unzip app into www
        run: |
          echo "All zips in repo:"
          git ls-files | grep -i '\.zip$' || true

          ZIP=$(git ls-files | grep -i '\.zip$' |
            while read -r f; do
              echo "$(git log -1 --format=%ct -- "$f") $f"
            done | sort -rn | head -n 1 | cut -d' ' -f2-)

          echo "Using newest zip: $ZIP"
          test -n "$ZIP"

          mkdir -p www
          unzip -oq "$ZIP" -d www

          if [ ! -f www/index.html ]; then
            SUB=$(find www -maxdepth 2 -name index.html | head -n 1 | xargs dirname)
            cp -a "$SUB"/. www/
          fi

          test -f www/index.html
          rm -rf www/supabase

          echo "Build tag in this zip:"
          grep -n "BUILD_TAG =" www/js/features/download-manager.js

          echo "Native folder check:"
          test -f www/native/android/KRDownloaderPlugin.java
          test -f www/native/android/MainActivity.java
          test -f www/native/android/open-with-filter.xml
          test -f www/js/features/library-screen.js

          for f in MuReaderActivity MuPdfView; do
            test -f www/native/android/$f.java ||
              echo "::warning::$f.java missing - the build will use the pdf.js reader"
          done

      - name: Capacitor setup
        run: |
          echo '{"name":"maktabah","version":"1.0.0","private":true}' > package.json

          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

          cat > capacitor.config.json <<'EOF2'
          {
            "appId": "com.kr.urdulibrary",
            "appName": "Maktabah",
            "webDir": "www"
          }
          EOF2

          npx cap add android

      - name: Bundle offline library (Supabase)
        continue-on-error: true
        run: |
          npm i --omit=optional @supabase/supabase-js@2 esbuild

          mkdir -p www/vendor
          echo "export { createClient } from '@supabase/supabase-js';" > vendor-entry.js

          npx esbuild vendor-entry.js \
            --bundle --format=esm --minify --platform=browser \
            --outfile=www/vendor/supabase.js

          echo "Vendor files:"
          ls -la www/vendor

      - name: Bundle offline fonts (Noto Naskh Arabic + Inter)
        continue-on-error: true
        run: |
          npm i --omit=optional @fontsource-variable/noto-naskh-arabic @fontsource-variable/inter

          for p in noto-naskh-arabic inter; do
            mkdir -p www/vendor/fonts/$p
            cp -r node_modules/@fontsource-variable/$p/files www/vendor/fonts/$p/files
            cp node_modules/@fontsource-variable/$p/index.css www/vendor/fonts/$p/index.css
          done

          python3 - <<'PY'
          import re, os, glob

          keep = {"latin", "arabic"}

          for css in glob.glob("www/vendor/fonts/*/index.css"):
              d = os.path.dirname(css)
              t = open(css, encoding="utf-8").read()

              blocks = re.findall(
                  r"(/\*\s*([\w-]+)\s*\*/\s*@font-face\s*\{.*?\})",
                  t,
                  flags=re.S
              )

              if not blocks:
                  print("no subset blocks in", css, "- keeping all")
                  continue

              out = "\n".join(b for b, name in blocks if name in keep) + "\n"
              used = set(re.findall(r"files/([^)'\"]+)", out))

              for f in glob.glob(d + "/files/*"):
                  if os.path.basename(f) not in used:
                      os.remove(f)

              open(css, "w", encoding="utf-8").write(out)
              print(css, "kept", sorted(used))
          PY

          python3 - <<'PY'
          import re

          p = "www/index.html"
          s = open(p, encoding="utf-8").read()

          local = (
              '<link rel="stylesheet" href="./vendor/fonts/noto-naskh-arabic/index.css">\n  '
              '<link rel="stylesheet" href="./vendor/fonts/inter/index.css">'
          )

          s2 = re.sub(
              r'<link rel="stylesheet" href="https://fonts\.googleapis\.com[^>]*>',
              local,
              s
          )

          s2 = re.sub(
              r'\s*<link rel="preconnect" href="https://fonts\.(googleapis|gstatic)\.com"[^>]*>',
              '',
              s2
          )

          open(p, "w", encoding="utf-8").write(s2)
          print("fonts link swapped:", s2 != s)
          PY

          echo "Font files:"
          ls www/vendor/fonts/*/files | head -20
          grep -n "vendor/fonts" www/index.html || true

      - name: Native Android plugin (Downloads, reader, Open with)
        run: |
          DEST=android/app/src/main/java/com/kr/urdulibrary

          cp www/native/android/*.java "$DEST"/
          ls -la "$DEST"

          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          f = open("www/native/android/open-with-filter.xml").read()

          if "application/pdf" not in s:
              s = s.replace("</activity>", f + "        </activity>", 1)

          if "MANAGE_EXTERNAL_STORAGE" not in s:
              perms = (
                  '    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n'
                  '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n'
              )

              s = s.replace(
                  "<application",
                  '<application android:requestLegacyExternalStorage="true"',
                  1
              )
              s = s.replace("<application", perms + "    <application", 1)

          open(p, "w").write(s)
          PY

          rm -rf www/native

          MF=android/app/src/main/AndroidManifest.xml

          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />#' "$MF"

          cat "$MF"

      - name: Native pull-to-refresh dependency
        run: |
          python3 - <<'PY'
          p = "android/app/build.gradle"
          s = open(p).read()

          dep = 'implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"'

          if "swiperefreshlayout" not in s:
              s = s.replace("dependencies {", "dependencies {\n    " + dep, 1)
              open(p, "w").write(s)
          PY

          grep -n "swiperefreshlayout" android/app/build.gradle

      - name: MuPDF native reader (dependency + activity)
        run: |
          META=$(curl -fsSL https://maven.ghostscript.com/com/artifex/mupdf/fitz/maven-metadata.xml || true)

          VER=$(echo "$META" |
            grep -o '<version>1\.24\.[0-9]*</version>' |
            sed 's/<[^>]*>//g' | sort -V | tail -1)

          if [ -z "$VER" ]; then
            VER=1.24.10
          fi

          echo "Using MuPDF fitz $VER"
          echo "$VER" > mupdf-version.txt

          python3 - <<'PY'
          import re

          ver = open("mupdf-version.txt").read().strip()

          r = "android/build.gradle"
          rs = open(r).read()
          repo = "maven { url 'https://maven.ghostscript.com/' }"

          if "maven.ghostscript.com" not in rs:
              rs = rs.replace("mavenCentral()", "mavenCentral()\n        " + repo)
              open(r, "w").write(rs)

          p = "android/app/build.gradle"
          s = open(p).read()

          dep = 'implementation "com.artifex.mupdf:fitz:%s"' % ver

          if "com.artifex.mupdf:fitz" not in s:
              s = s.replace("dependencies {", "dependencies {\n    " + dep, 1)
              open(p, "w").write(s)

          m = "android/app/src/main/AndroidManifest.xml"
          t = open(m).read()

          act = (
              '        <activity android:name=".MuReaderActivity" android:exported="false"'
              ' android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|uiMode"'
              ' android:theme="@android:style/Theme.DeviceDefault.NoActionBar" />\n'
          )

          if "MuReaderActivity" not in t:
              t = t.replace("</application>", act + "    </application>", 1)
              open(m, "w").write(t)
          PY

          grep -n "ghostscript" android/build.gradle
          grep -n "fitz\|swiperefresh" android/app/build.gradle
          grep -n "MuReaderActivity" android/app/src/main/AndroidManifest.xml

      - name: App icon
        continue-on-error: true
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick

          IM=$(command -v magick || command -v convert)
          ICON=www/assets/icons/icon-512.png
          RES=android/app/src/main/res

          rm -rf $RES/mipmap-anydpi-v26

          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}
            s=${d##*:}

            $IM $ICON -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            cp $RES/mipmap-$n/ic_launcher.png $RES/mipmap-$n/ic_launcher_round.png
          done

      - name: Native splash (matches the in-app splash)
        continue-on-error: true
        run: |
          python3 www/assets/splash/setup_splash.py
          rm -rf www/assets/splash

      - name: Smaller APK (single CPU architecture)
        run: |
          python3 - <<'PY'
          import os

          p = "android/app/build.gradle"
          s = open(p).read()

          abis = ", ".join('"%s"' % a.strip() for a in os.environ["ABIS"].split(","))

          if "abiFilters" not in s:
              s = s.replace(
                  "defaultConfig {",
                  "defaultConfig {\n        ndk { abiFilters %s }" % abis,
                  1
              )
              open(p, "w").write(s)
          PY

          grep -n "abiFilters" android/app/build.gradle
        env:
          ABIS: "arm64-v8a"

      - name: Configure release signing + version code
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -Eeuo pipefail

          test -n "$KEYSTORE_BASE64" || {
            echo "::error::KEYSTORE_BASE64 secret is missing"
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "::error::KEYSTORE_PASSWORD secret is missing"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "::error::KEY_ALIAS secret is missing"
            exit 1
          }

          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode > android/app/release.keystore

          test -s android/app/release.keystore

          keytool -list \
            -keystore android/app/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          python3 - <<'PY'
          import os
          import re

          p = "android/app/build.gradle"
          s = open(p).read()

          if "signingConfigs {" not in s:
              signing = """
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              """

              s = re.sub(
                  r'(?m)^android\s*\{',
                  lambda m: m.group(0) + signing,
                  s,
                  count=1
              )

          build_types = re.search(r'(?m)^\s*buildTypes\s*\{', s)

          if not build_types:
              raise SystemExit("Could not find buildTypes block")

          match = re.search(
              r'(?m)^\s*release\s*\{',
              s[build_types.end():]
          )

          if not match:
              raise SystemExit("Could not find release build type")

          start = build_types.end() + match.end()
          block_end = s.find('\n        }', start)

          block = s[start:block_end if block_end != -1 else len(s)]

          if "signingConfig signingConfigs.release" not in block:
              s = (
                  s[:start]
                  + "\n            signingConfig signingConfigs.release"
                  + s[start:]
              )

          run_number = int(os.environ["RUN_NUMBER"])

          if re.search(r'(?m)^\s*versionCode\s+\d+', s):
              s = re.sub(
                  r'(?m)^\s*versionCode\s+\d+',
                  "        versionCode " + str(run_number),
                  s,
                  count=1
              )
          else:
              s = re.sub(
                  r'(?m)^(\s*defaultConfig\s*\{)',
                  r'\1\n        versionCode ' + str(run_number),
                  s,
                  count=1
              )

          s = re.sub(
              r'(?m)^\s*versionName\s+"[^"]*"',
              '        versionName "1.0.' + str(run_number) + '"',
              s,
              count=1
          )

          open(p, "w").write(s)
          print("Release signing and version code configured.")
          PY

          grep -n "signingConfigs\|signingConfig signingConfigs.release\|versionCode\|versionName" android/app/build.gradle

      - name: Sync
        run: npx cap sync android

      - name: Build Release APK
        working-directory: android
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set +e

          ./gradlew assembleRelease 2>&1 | tee ../build1.log
          RC=${PIPESTATUS[0]}

          set -e

          if [ "$RC" -eq 0 ]; then
            exit 0
          fi

          echo "::warning::MuPDF release build failed; retrying without MuPDF."

          echo "## MuPDF release build failed - retrying without MuPDF" \
            >> "$GITHUB_STEP_SUMMARY"

          echo '```' >> "$GITHUB_STEP_SUMMARY"

          grep -E "error:|\.java:[0-9]+|What went wrong|Could not|not found|FAILED" \
            ../build1.log | head -60 >> "$GITHUB_STEP_SUMMARY" || true

          echo '```' >> "$GITHUB_STEP_SUMMARY"

          rm -f app/src/main/java/com/kr/urdulibrary/MuPdfView.java
          rm -f app/src/main/java/com/kr/urdulibrary/MuReaderActivity.java

          python3 - <<'PY'
          import re

          p = "app/build.gradle"
          s = open(p).read()

          s = re.sub(
              r'\n\s*implementation "com\.artifex\.mupdf:fitz:[^"]*"',
              '',
              s
          )

          open(p, "w").write(s)

          m = "app/src/main/AndroidManifest.xml"
          t = open(m).read()

          t = re.sub(
              r'\s*<activity android:name="\.MuReaderActivity"[^>]*/>',
              '',
              t
          )

          open(m, "w").write(t)
          PY

          ./gradlew assembleRelease

      - name: Verify Release APK signature
        run: |
          set -Eeuo pipefail

          APK=android/app/build/outputs/apk/release/app-release.apk

          test -s "$APK"

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)

          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

          echo "Release APK exists and its signature verified."

      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: Maktabah-Release-APK-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
